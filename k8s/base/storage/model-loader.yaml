# Not part of the kustomization: a one-off pod for copying the model files onto the breastcare-models volume.
#   kubectl -n breastcare-test apply -f k8s/base/storage/model-loader.yaml
#   kubectl -n breastcare-test cp ML-Service/weights/. model-loader:/models
#   kubectl -n breastcare-test delete pod model-loader
apiVersion: v1
kind: Pod
metadata:
  name: model-loader
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: loader
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: models
          mountPath: /models
  volumes:
    - name: models
      persistentVolumeClaim:
        claimName: breastcare-models
