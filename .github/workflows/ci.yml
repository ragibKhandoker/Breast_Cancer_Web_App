# Tests, scans and container images. Runs on every push and pull request; images are published to GHCR only from
# main and from version tags (v1.2.3), never from pull requests.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx vite build --outDir dist --emptyOutDir

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Runs against a throwaway local MongoDB (Flapdoodle), never Atlas. Tests that need the trained model files
      # (not in git) are skipped automatically.
      - run: chmod +x mvnw && ./mvnw -B test

  blockchain-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx hardhat test

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Report HIGH and CRITICAL findings in npm/Maven dependencies and committed secrets...
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
      # ...and fail on fixable CRITICAL ones.
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  images:
    needs: [frontend-test, backend-test, blockchain-test, dependency-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            context: Backend
          - component: frontend
            context: Frontend
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breastcare-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/setup-buildx-action@v3
      # Build once and load it locally, so it is scanned before anything is published.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.name.outputs.image }}:scan
          load: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.name.outputs.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
