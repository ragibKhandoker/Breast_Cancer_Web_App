spring.application.name=backend
# 8080 is taken by Apache (XAMPP) on this machine.
server.port=${SERVER_PORT:8081}

# Secrets (MongoDB Atlas URI) live in Backend/.env, which is git-ignored. See .env.example.
spring.config.import=optional:file:.env[.properties]

# Spring Boot 4 property name (Boot 3 called it spring.data.mongodb.uri); the database name comes from the URI
# path. Required: config/MongoUriCheck stops startup with a clear message when it is missing.
spring.mongodb.uri=${MONGODB_URI:}
# The driver logs a long stack trace on every retry; StartupReport prints the status instead.
logging.level.org.mongodb.driver.cluster=WARN

spring.servlet.multipart.max-file-size=50MB
# The request also carries the form fields, so allow a little more than the file itself.
spring.servlet.multipart.max-request-size=51MB

# ONNX model produced by ML-Service/export_onnx.py; relative to the Backend folder.
ml.model.path=${MODEL_PATH:../ML-Service/weights/model.onnx}
# "Is this a mammogram?" check (ML-Service/train_gate.py); uploads are refused while it is missing.
ml.gate.path=${GATE_PATH:../ML-Service/weights/gate/gate.onnx}
# ianpan/mammoscreen net0 + cropper (ML-Service/evaluate_mammoscreen.py exports them).
ml.mammoscreen.dir=${MAMMOSCREEN_DIR:../ML-Service/weights/mammoscreen}
# How the two models are combined, and the combination's test results (ML-Service/compare_ensemble.py).
ml.ensemble.path=${ENSEMBLE_PATH:../ML-Service/weights/ensemble/ensemble.json}
# RSNA 2023 1st-place model, fold 0 (ML-Service/export_firstplace.py), and how it joins the estimate.
ml.firstplace.path=${FIRSTPLACE_PATH:../ML-Service/weights/firstplace/firstplace_fold0.onnx}
ml.final.path=${FINAL_PATH:../ML-Service/weights/final/final.json}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Login (see security/SecurityConfig). JWT_SECRET is required: a long random value, kept only in Backend/.env.
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.token-ttl=${JWT_TTL:PT2H}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.issuer=breastcare-backend

# Optional first administrator (config/AdminBootstrap). Created once if no account has this email.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:Administrator}
