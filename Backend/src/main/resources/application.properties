spring.application.name=backend
# 8080 is taken by Apache (XAMPP) on this machine.
server.port=${SERVER_PORT:8081}
# Every browser tab keeps its own login cookie (see AuthCookies), so many open tabs make a long Cookie header.
server.max-http-request-header-size=64KB

# Secrets (MongoDB Atlas URI) live in Backend/.env, which is git-ignored. See .env.example.
spring.config.import=optional:file:.env[.properties]

# Spring Boot 4 property name (Boot 3 called it spring.data.mongodb.uri); the database name comes from the URI
# path. Required: config/MongoUriCheck stops startup with a clear message when it is missing.
spring.mongodb.uri=${MONGODB_URI:}
# The driver logs a long stack trace on every retry; StartupReport prints the status instead.
logging.level.org.mongodb.driver.cluster=WARN

spring.servlet.multipart.max-file-size=50MB
# The request also carries the form fields, so allow a little more than the file itself.
spring.servlet.multipart.max-request-size=51MB

# ONNX model produced by ML-Service/export_onnx.py; relative to the Backend folder.
ml.model.path=${MODEL_PATH:../ML-Service/weights/model.onnx}
# "Is this a mammogram?" check (ML-Service/train_gate.py); uploads are refused while it is missing.
ml.gate.path=${GATE_PATH:../ML-Service/weights/gate/gate.onnx}
# ianpan/mammoscreen net0 + cropper (ML-Service/evaluate_mammoscreen.py exports them).
ml.mammoscreen.dir=${MAMMOSCREEN_DIR:../ML-Service/weights/mammoscreen}
# How the two models are combined, and the combination's test results (ML-Service/compare_ensemble.py).
ml.ensemble.path=${ENSEMBLE_PATH:../ML-Service/weights/ensemble/ensemble.json}
# RSNA 2023 1st-place model, fold 0 (ML-Service/export_firstplace.py), and how it joins the estimate.
ml.firstplace.path=${FIRSTPLACE_PATH:../ML-Service/weights/firstplace/firstplace_fold0.onnx}
ml.final.path=${FINAL_PATH:../ML-Service/weights/final/final.json}
# Copy of model.onnx with a heatmap output (ML-Service/heatmap_output.py); only draws the report page heatmap.
ml.heatmap.path=${HEATMAP_PATH:../ML-Service/weights/heatmap.onnx}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Login (see security/SecurityConfig). JWT_SECRET is required: a long random value, kept only in Backend/.env.
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.token-ttl=${JWT_TTL:PT2H}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.issuer=breastcare-backend

# Optional first administrator (config/AdminBootstrap). Created once if no account has this email.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:Administrator}

# Breast Surgeon appointments: the clinic time zone that dates and time slots are in.
app.appointments.time-zone=${APPOINTMENT_TIME_ZONE:Asia/Dhaka}

# Breast health chatbot (POST /api/chat) through Google Gemini (generateContent). Without a key the chatbot answers 503.
chat.gemini.api-key=${GEMINI_API_KEY:}
chat.gemini.model=${CHAT_MODEL:gemini-3.8-flash}
chat.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# F20 audit log and blockchain proofs (docs/F20_AUDIT_BLOCKCHAIN_BACKUP_PRIVACY.md). Anchoring is off by default;
# point it only at a private or test Ethereum node (Hardhat, Anvil, Ganache, private Geth/Besu), never a public mainnet.
audit.blockchain.enabled=${AUDIT_BLOCKCHAIN_ENABLED:false}
audit.blockchain.rpc-url=${AUDIT_BLOCKCHAIN_RPC_URL:}
audit.blockchain.account=${AUDIT_BLOCKCHAIN_ACCOUNT:}
audit.blockchain.network-name=${AUDIT_BLOCKCHAIN_NETWORK:private-test-network}
# Optional: the AuditIntegrity contract (Backend/blockchain, deployed with Hardhat). Empty = plain proof transactions.
audit.blockchain.contract=${AUDIT_BLOCKCHAIN_CONTRACT:}
audit.blockchain.poll-interval=${AUDIT_BLOCKCHAIN_POLL_INTERVAL:PT30S}

# F20 encrypted backups. Without BACKUP_ENCRYPTION_KEY (32 random bytes, base64) no backup is written.
backup.dir=${BACKUP_DIR:backups}
backup.encryption-key=${BACKUP_ENCRYPTION_KEY:}
# A cron expression in UTC (e.g. 0 0 2 * * * for 02:00 daily); "-" turns scheduled backups off.
backup.schedule=${BACKUP_SCHEDULE:-}
backup.retention.enabled=${BACKUP_RETENTION_ENABLED:false}
backup.retention.daily=${BACKUP_RETENTION_DAILY:7}
backup.retention.weekly=${BACKUP_RETENTION_WEEKLY:4}
backup.retention.monthly=${BACKUP_RETENTION_MONTHLY:3}
# Restore tests write a copy into <database>_restore_test. Keep this false on the production server.
backup.restore.enabled=${BACKUP_RESTORE_ENABLED:false}
backup.restore.keep-test-database=${BACKUP_RESTORE_KEEP_TEST_DATABASE:false}

# Health for containers and Kubernetes: /actuator/health (all), /actuator/health/liveness (the app is running) and
# /actuator/health/readiness (ready for traffic; includes MongoDB). Only health is exposed over HTTP.
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,mongo
# Structured JSON logs (ECS) in containers: set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (the Docker/Kubernetes config does).
