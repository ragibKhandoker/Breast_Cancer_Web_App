spring.application.name=backend
# 8080 is taken by Apache (XAMPP) on this machine.
server.port=${SERVER_PORT:8081}

# Secrets (MongoDB Atlas URI) live in Backend/.env, which is git-ignored. See .env.example.
spring.config.import=optional:file:.env[.properties]

# Spring Boot 4 property name; the database name comes from the URI path.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/breast_cancer}
# The driver logs a long stack trace on every retry; StartupReport prints the status instead.
logging.level.org.mongodb.driver.cluster=WARN

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ONNX model produced by ML-Service/export_onnx.py; relative to the Backend folder.
ml.model.path=${MODEL_PATH:../ML-Service/weights/model.onnx}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
