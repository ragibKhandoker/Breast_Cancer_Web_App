# TEMPLATE ONLY. Never commit real values. Create the real Secret from your terminal or a secret manager, e.g.:
#   kubectl -n breastcare-test create secret generic breastcare-secrets \
#     --from-literal=MONGODB_URI='mongodb+srv://...' --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=BACKUP_ENCRYPTION_KEY="$(openssl rand -base64 32)" --from-literal=GEMINI_API_KEY='AIza...'
# Kubernetes Secrets are only base64-encoded, not encrypted: enable encryption at rest in the cluster and limit who
# can read Secrets (RBAC), or use a secret manager (External Secrets, Sealed Secrets, Vault, cloud KMS).
apiVersion: v1
kind: Secret
metadata:
  name: breastcare-secrets
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://USER:PASSWORD@CLUSTER.mongodb.net/breast_cancer?retryWrites=true&w=majority"
  JWT_SECRET: "<at least 32 random characters>"
  BACKUP_ENCRYPTION_KEY: "<32 random bytes, base64>"
  GEMINI_API_KEY: "<optional, for the breast health chatbot>"
